services:
  upload:
    build: .
    command: ["-s", "-p", "5201", "-J", "--server-bitrate-limit", "10M"]
    ports:
      - "5201:5201/tcp"
      - "5201:5201/udp"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  download:
    build: .
    command: ["-s", "-p", "5202", "-J", "--server-bitrate-limit", "10M"]
    ports:
      - "5202:5202/tcp"
      - "5202:5202/udp"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
