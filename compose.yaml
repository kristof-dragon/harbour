services:
  harbour:
    build: .
    mem_limit: ${HARBOUR_WEB_MEMORY_MIB:-768}m
    memswap_limit: ${HARBOUR_WEB_MEMORY_MIB:-768}m
    ports:
      - "${HARBOUR_PORT:-8080}:8080"
    environment:
      FIRST_RUN: ${FIRST_RUN:-False}
      HARBOUR_ADMIN: ${HARBOUR_ADMIN:-}
      HARBOUR_ADMIN_PASSWORD_HASH: ${HARBOUR_ADMIN_PASSWORD_HASH:-}
      HARBOUR_BOOTSTRAP_ID: ${HARBOUR_BOOTSTRAP_ID:-}
      HARBOUR_SECRET: ${HARBOUR_SECRET:?Set HARBOUR_SECRET in .env}
      HARBOUR_SECURE_COOKIE: ${HARBOUR_SECURE_COOKIE:-false}
      HARBOUR_ORIGIN: ${HARBOUR_ORIGIN:-http://localhost:8080}
      HARBOUR_TRUSTED_PROXIES: ${HARBOUR_TRUSTED_PROXIES:-}
      HARBOUR_DATA: /data
      HARBOUR_RESOURCE_PROFILE: ${HARBOUR_RESOURCE_PROFILE:-standard}
      HARBOUR_PROCESSING_MIB: ${HARBOUR_PROCESSING_MIB:-32}
      HARBOUR_BUFFER_TOTAL_MIB: ${HARBOUR_BUFFER_TOTAL_MIB:-128}
      HARBOUR_WRITE_INTERVAL_SECONDS: ${HARBOUR_WRITE_INTERVAL_SECONDS:-1}
    volumes:
      - harbour-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  network-recorder:
    build: .
    mem_limit: ${HARBOUR_RECORDER_MEMORY_MIB:-768}m
    memswap_limit: ${HARBOUR_RECORDER_MEMORY_MIB:-768}m
    init: true
    stop_grace_period: 45s
    command: ["python", "-m", "harbour.network_recorder"]
    environment:
      HARBOUR_SECRET: ${HARBOUR_SECRET:?Set HARBOUR_SECRET in .env}
      HARBOUR_DATA: /data
      HARBOUR_RESOURCE_PROFILE: ${HARBOUR_RESOURCE_PROFILE:-standard}
      HARBOUR_PROCESSING_MIB: ${HARBOUR_PROCESSING_MIB:-32}
      HARBOUR_BUFFER_TOTAL_MIB: ${HARBOUR_BUFFER_TOTAL_MIB:-128}
      HARBOUR_WRITE_INTERVAL_SECONDS: ${HARBOUR_WRITE_INTERVAL_SECONDS:-1}
      SQLITE_TMPDIR: /data/sqlite-tmp
    volumes:
      - harbour-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ping_group_range: "10001 10001"
    depends_on:
      harbour:
        condition: service_healthy
volumes:
  harbour-data:
